<!DOCTYPE html>
<html>
<head>
  <title>Call Your AI</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      width: 360px;
      padding: 14px 16px 12px;
      margin: 0;
      color: #333;
    }

    /* ── Header ── */
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 14px;
    }

    h1 {
      color: #3B82F6;
      font-size: 17px;
      margin: 0;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    h1 img { width: 20px; height: 20px; }

    .settings-icon {
      color: #94a3b8;
      text-decoration: none;
      font-size: 18px;
      line-height: 1;
    }

    .settings-icon:hover { color: #3B82F6; }

    /* ── Input row ── */
    .input-group { margin-bottom: 12px; }

    .input-wrapper {
      display: flex;
      border: 1px solid #ddd;
      border-radius: 8px;
      overflow: hidden;
    }

    input[type="text"] {
      flex: 1;
      padding: 9px 10px;
      border: none;
      outline: none;
      font-size: 14px;
    }

    .btn-ask {
      background: #3B82F6;
      color: white;
      border: none;
      padding: 9px 13px;
      cursor: pointer;
      font-size: 14px;
      transition: background 0.15s;
    }

    .btn-ask:hover { background: #2563EB; }

    /* ── Action buttons row ── */
    .action-row {
      display: flex;
      gap: 8px;
      margin-bottom: 12px;
    }

    .btn-secondary {
      flex: 1;
      padding: 7px 10px;
      font-size: 12px;
      border: 1px solid #ddd;
      border-radius: 7px;
      background: #f8fafc;
      cursor: pointer;
      transition: background 0.15s;
      text-align: center;
    }

    .btn-secondary:hover { background: #e2e8f0; }

    /* ── Service grid ── */
    #servicesGrid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      margin-bottom: 12px;
    }

    .service {
      position: relative;
      padding: 9px 8px;
      background: #f1f5f9;
      border: 2px solid transparent;
      border-radius: 8px;
      cursor: pointer;
      transition: background 0.15s, border-color 0.15s;
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 13px;
      overflow: hidden;
    }

    .service:hover { background: #e2e8f0; }

    .service.selected {
      border-color: #3B82F6;
      background: #EFF6FF;
      font-weight: 600;
    }

    .service .emoji { font-size: 16px; flex-shrink: 0; }
    .service .svc-name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

    .usage-badge {
      position: absolute;
      top: 3px;
      right: 5px;
      font-size: 10px;
      color: #94a3b8;
      font-weight: 500;
    }

    /* ── History ── */
    #historySection { margin-bottom: 10px; }

    .section-label {
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: #94a3b8;
      margin-bottom: 5px;
    }

    #historyList {
      display: flex;
      flex-direction: column;
      gap: 4px;
      max-height: 140px;
      overflow-y: auto;
    }

    .history-item {
      display: flex;
      align-items: center;
      gap: 7px;
      padding: 5px 8px;
      border-radius: 6px;
      font-size: 13px;
      cursor: pointer;
      background: #f8fafc;
      transition: background 0.12s;
    }

    .history-item:hover { background: #e2e8f0; }

    .h-icon { font-size: 14px; flex-shrink: 0; }

    .h-text {
      flex: 1;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      color: #444;
    }

    /* ── Footer ── */
    footer {
      font-size: 11px;
      color: #aaa;
      margin-top: 8px;
      text-align: center;
    }

    .tip { font-size: 12px; color: #888; margin-bottom: 10px; }
  </style>
</head>
<body>
  <div class="header">
    <h1>
      <img src="icons/store/icon16.png" alt="logo">
      Call Your AI
    </h1>
    <a href="#" class="settings-icon" id="settingsLink" title="Settings">⚙️</a>
  </div>

  <div class="input-group">
    <div class="input-wrapper">
      <input type="text" id="query" placeholder="Ask any AI...">
      <button class="btn-ask" id="submitQuery">Ask</button>
    </div>
  </div>

  <div class="action-row">
    <button class="btn-secondary" id="askAllBtn">🌐 Ask all services</button>
    <button class="btn-secondary" id="summarizeBtn">📄 Summarize this page</button>
  </div>

  <div id="servicesGrid"></div>

  <div class="tip">
    Tip: Type <strong>@servicename</strong> in the address bar, or <strong>@all</strong> to compare!
  </div>

  <div id="historySection" style="display:none">
    <div class="section-label">Recent queries</div>
    <div id="historyList"></div>
  </div>

  <footer>Call Your AI · v1.1</footer>

  <script src="popup.js" type="module"></script>
</body>
</html>
